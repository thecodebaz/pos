<!DOCTYPE html>
<html lang="pt-MZ">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sem ligação · POS</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #fafafa;
        color: #18181b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      main {
        max-width: 30rem;
      }
      .icon {
        width: 56px;
        height: 56px;
        margin: 0 auto 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 16px;
        background: #f4f4f5;
        color: #71717a;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.35rem;
        line-height: 1.2;
      }
      p {
        margin: 0 0 20px;
        font-size: 0.95rem;
        line-height: 1.5;
        color: #52525b;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 40px;
        padding: 0 18px;
        border-radius: 10px;
        background: #059669;
        color: #fff;
        font-size: 0.95rem;
        font-weight: 600;
        text-decoration: none;
      }
      a:hover {
        background: #047857;
      }
      small {
        display: block;
        margin-top: 14px;
        font-size: 0.75rem;
        color: #71717a;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 2l20 20" />
          <path d="M8.5 8.5a10.9 10.9 0 0 1 12 2.5" />
          <path d="M5 12.5a15 15 0 0 1 3.5-2.4" />
          <path d="M8.5 16.5a5 5 0 0 1 7 0" />
          <path d="M12 20h.01" />
        </svg>
      </div>
      <h1>Sem ligação</h1>
      <p>
        Esta página ainda não está guardada no dispositivo. O ponto de venda continua a funcionar com os dados
        locais: abra a aplicação pelo ícone instalado ou recarregue a página inicial.
      </p>
      <a href="/">Abrir o POS</a>
      <small>Os dados ficam apenas neste dispositivo. Faça backups regulares.</small>
    </main>
  </body>
</html>
